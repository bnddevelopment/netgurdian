<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>NetGuardian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column. Dark game shell, with scenarios shown as light "screens" inside it. */
:root{
  --bg:#201E50; --btn:#5D4EBC; --pop:#FF6B6B; --icon:#FFC857; --text:#FFFFFF; --paper:#F8F5FF; --ink:#201E50;
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.16); --muted:rgba(255,255,255,.74); --good:#5FD4A0;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;margin:0}
.wrap{max-width:880px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.7rem;font-weight:800} h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mut{color:var(--muted)} .sm{font-size:.88rem}
.ic{width:1.15em;height:1.15em;fill:currentColor;color:var(--icon);vertical-align:-.2em;flex:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.88rem}

/* header + nav */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.01em}
.logo .ic{width:1.5em;height:1.5em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;font:600 .82rem var(--body);cursor:pointer;min-width:0}
nav button.on{background:var(--btn);border-color:transparent}
nav .ic{width:1.4em;height:1.4em}

/* buttons */
.btn{background:var(--btn);color:#fff;border:2px solid transparent;border-radius:10px;padding:.65rem 1.1rem;font:700 1rem var(--body);cursor:pointer}
.btn:hover{filter:brightness(1.12)} .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border-color:var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--icon);outline-offset:2px}
.big{padding:.9rem 1.4rem;font-size:1.1rem}

/* scenario "screens" */
.stage{display:grid;gap:12px}
.mock{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;font-size:.95rem;border:1px solid var(--line)}
.mock .mh{padding:10px 14px;border-bottom:1px solid #DDD6F5;background:#EFEAFB}
.mock .mb{padding:14px;display:grid;gap:10px}
.mock .subj{font-weight:700;margin-top:2px}
.mock .addr,.mock .mutd{color:#5b5885}
.mock .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#EFEAFB;border-bottom:1px solid #DDD6F5}
.mock .url{background:#fff;border:1px solid #D3CBEE;border-radius:99px;padding:2px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;overflow-wrap:anywhere;min-width:0}
.mock code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1px solid #D3CBEE;border-radius:6px;padding:0 6px;overflow-wrap:anywhere}
.fb{display:inline-block;background:var(--btn);color:#fff;border-radius:8px;padding:.45rem .9rem;font-weight:700}
.hov{font-size:.85rem;color:#5b5885}
.pop{border:2px dashed #b9aee8;border-radius:10px;padding:14px;text-align:center;display:grid;gap:8px}
.chat{gap:8px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;overflow-wrap:anywhere}
.bub.them{background:#fff;border:1px solid #D3CBEE;justify-self:start;border-bottom-left-radius:4px}
.bub.me{background:var(--btn);color:#fff;justify-self:end}
.perm{display:grid;gap:6px;padding-left:1.1em;margin:0}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;font:500 1rem var(--body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--icon)}
.opt:disabled{cursor:default;color:var(--text)}
.opt.ok{border-color:var(--good);background:rgba(95,212,160,.18)}
.opt.bad{border-color:var(--pop);background:rgba(255,107,107,.2)}
.hintbox{background:var(--card);border:1px dashed var(--icon);border-radius:10px;padding:10px 12px}

/* meters */
.bar2{height:10px;border-radius:99px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--icon);border-radius:99px;transition:width .3s}
.timer{height:8px;border-radius:99px;background:var(--card);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--icon)}
.sb{display:grid;grid-template-columns:minmax(70px,120px) 1fr 52px;gap:10px;align-items:center;padding:3px 0}
.sb .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{height:10px;background:var(--card);border-radius:99px;overflow:hidden}.sbar i{display:block;height:100%;background:var(--btn);border-radius:99px;transition:width .4s}
.sb b{text-align:right;font-variant-numeric:tabular-nums}

/* modal + notes use the pop-up colour */
.overlay{position:fixed;inset:0;background:rgba(10,8,40,.62);display:grid;place-items:center;padding:16px;z-index:50}
.modal,.note{background:var(--pop);color:var(--ink);border-radius:16px;padding:20px;display:grid;gap:12px}
.modal{max-width:480px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.modal h2,.note h3{color:var(--ink)}
.modal .ic,.note .ic{color:var(--ink)}
.modal .btn,.note .btn{border-color:#fff}
.modal .btn.ghost,.note .btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.modal ul{margin:0;padding-left:1.1em;display:grid;gap:4px}

/* home */
.hero{display:grid;gap:14px}
dl{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0}
dt{color:var(--muted)} dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.av{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;padding:3px;background:var(--line);flex:none}
.av span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg)}
.av .ic{width:1.5em;height:1.5em}
input.name{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;font:700 1.2rem var(--display);width:100%;max-width:260px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{flex:1 1 auto}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)} td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
tr.me td{background:rgba(255,200,87,.16)}
.swatches{display:flex;gap:6px}.swatches i{width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- dashboard redesign ---- */
.wrap{max-width:1100px}
.top{background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 18px}
.logo{color:var(--ink);font-size:1.9rem}
.logo .ic{color:var(--btn)}
.top .chip{background:transparent;border:0;color:var(--ink);padding:2px 6px}
.top .chip .ic{width:1.4em;height:1.4em}
.hright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.setbtn{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font:700 .95rem var(--body);cursor:pointer;padding:4px 6px;border-radius:8px}
.setbtn .ic{width:1.5em;height:1.5em}
.who{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid #D3CBEE;font-weight:700;color:var(--ink)}
.who .av{width:44px;height:44px}
.dash{display:grid;grid-template-columns:1.5fr 1fr .85fr;gap:16px;align-items:stretch}
.panel{background:var(--paper);color:var(--ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-width:0}
.panel h2{color:var(--ink);font-size:2rem}
.panel .big-ic{width:130px;height:130px}
.panel .big-ic.warm{color:var(--pop)}
.panel .trophy{width:52px;height:52px}
.grow{flex:1}
.streak{display:inline-flex;align-items:center;gap:6px;background:#EFEAFB;border-radius:99px;padding:4px 16px;font-weight:700}
.streak .ic{color:var(--pop)}
.go{width:100%;border:0;border-radius:12px;padding:.8rem 1rem;color:#fff;font:800 1.7rem var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:linear-gradient(90deg,var(--pop),var(--btn))}
.go:hover{filter:brightness(1.08)}
.go.sm2{font-size:1.4rem}
.gorow{display:flex;gap:12px;width:100%}.gorow .go{flex:1}
.side{display:grid;gap:16px;grid-template-rows:auto 1fr}
.sidecard{background:var(--paper);color:var(--ink);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.sidecard .sh{background:var(--pop);color:var(--ink);font:800 1.1rem var(--display);text-transform:uppercase;text-align:center;padding:12px}
.sidecard .sb2{padding:16px;display:grid;gap:12px;justify-items:center;text-align:center}
.sidecard h3{color:var(--ink)}
.claim{border:0;border-radius:99px;padding:.4rem 1.6rem;color:#fff;font:700 .9rem var(--body);cursor:pointer;background:linear-gradient(90deg,var(--pop),var(--btn))}
.claim:disabled{opacity:.5;cursor:default}
.prof{padding:16px}
.prof h3{margin-bottom:8px}
.stats{display:flex;justify-content:space-between;gap:12px}
.stats div{display:grid}.stats span{color:#5b5885;font-size:.95rem}.stats b{font:800 1.6rem var(--display)}
.tip{background:var(--icon);color:var(--ink);border-radius:14px;padding:14px 18px;text-align:center}
.tip b{font-weight:800}
.setform{display:grid;gap:6px}
.setform input.name{background:#fff;color:var(--ink);border-color:var(--ink);max-width:none}
@media (max-width:860px){.dash{grid-template-columns:1fr}.side{grid-template-rows:auto}.hright{width:100%}}

/* ---- online ---- */
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--good);vertical-align:.05em}
.prow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
.prow:last-child{border-bottom:0}
.prow .av{width:36px;height:36px}
.prow .pn{font-weight:700;overflow-wrap:anywhere;min-width:0}
.bigcode{font:800 2.4rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--icon)}
input.code-in{font-size:1rem;max-width:160px;text-transform:uppercase;letter-spacing:.08em}
.searching{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--icon);animation:spin 1s linear infinite;vertical-align:-.15em}
.note .searching{border-color:rgba(32,30,80,.25);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.searching{animation:none}}
/* ===== game skin: neon arcade HUD over a moving grid floor. Shop themes still drive --bg/--btn/--pop/--icon ===== */
:root{
  --display:'Lilita One','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --panel:color-mix(in srgb,var(--bg) 72%,#000); --panel2:color-mix(in srgb,var(--bg) 62%,var(--btn));
  --edge:color-mix(in srgb,var(--btn) 65%,#fff); --sh:color-mix(in srgb,var(--btn) 50%,#000); --bad:#FF5A6E; --dark:#15123A;
}
body{background:radial-gradient(1100px 620px at 50% -12%,color-mix(in srgb,var(--btn) 42%,var(--bg)),var(--bg) 62%) fixed,var(--bg);font-weight:600}
h1,h2,h3{font-weight:400;letter-spacing:.01em}
h2{font-size:2rem;text-shadow:0 3px 0 rgba(0,0,0,.35)}
h3{font-size:1.25rem}
.sub{color:var(--muted)}
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bgfx::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-8%;height:52%;
  background-image:linear-gradient(color-mix(in srgb,var(--btn) 70%,transparent) 2px,transparent 2px),linear-gradient(90deg,color-mix(in srgb,var(--btn) 70%,transparent) 2px,transparent 2px);
  background-size:64px 64px;transform:perspective(380px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 5%,transparent 80%);mask-image:linear-gradient(to top,#000 5%,transparent 80%);opacity:.5;animation:floor 2.6s linear infinite}
#bgfx::after{content:"";position:absolute;inset:0;opacity:.7;animation:twinkle 5s ease-in-out infinite alternate;
  background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 12%,#fff,transparent),radial-gradient(2px 2px at 40% 32%,#fff9,transparent),radial-gradient(1.5px 1.5px at 88% 40%,#fff,transparent),radial-gradient(2px 2px at 25% 52%,#fff8,transparent),radial-gradient(1.5px 1.5px at 62% 24%,#fff,transparent),radial-gradient(2px 2px at 5% 40%,#fff9,transparent),radial-gradient(1.5px 1.5px at 52% 8%,#fff,transparent)}

/* HUD */
.top{background:linear-gradient(180deg,var(--panel2),var(--panel));color:#fff;border:3px solid var(--edge);border-radius:20px;padding:10px 16px;
  box-shadow:0 6px 0 var(--sh),0 0 34px color-mix(in srgb,var(--btn) 38%,transparent)}
.logo{color:#fff;font-size:2.1rem;font-weight:400;text-shadow:0 3px 0 var(--sh)}
.logo .ic{color:var(--icon);width:1.3em;height:1.3em}
.top .chip{background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.14);color:#fff;padding:3px 12px 3px 6px;border-radius:99px;font:400 1.1rem var(--display)}
.top .chip.lv{background:linear-gradient(180deg,var(--icon),color-mix(in srgb,var(--icon) 60%,var(--pop)));color:var(--dark);border-color:rgba(255,255,255,.5);padding:3px 12px}
.chip.bump{animation:bump .55s}
.setbtn,.who{color:#fff}
.setbtn{font:400 1rem var(--display);letter-spacing:.02em}
.setbtn .ic{color:var(--icon)}
.who{border-left-color:rgba(255,255,255,.2)}

/* nav as game tabs */
nav{gap:10px}
nav button{background:var(--panel);color:#fff;border:3px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.45);
  font:400 1rem var(--display);letter-spacing:.03em;padding:8px 4px 6px;transition:transform .08s,box-shadow .08s}
nav button:hover{transform:translateY(-2px)}
nav button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
nav button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--btn) 75%,#fff),var(--btn));border-color:var(--edge);box-shadow:0 5px 0 var(--sh)}
nav button.on .ic{color:#fff}

/* chunky 3D buttons */
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--btn) 72%,#fff),var(--btn));color:#fff;border:3px solid color-mix(in srgb,var(--btn) 45%,#fff);
  border-radius:14px;box-shadow:0 5px 0 var(--sh);font:400 1.1rem var(--display);letter-spacing:.03em;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.btn:disabled{box-shadow:0 2px 0 var(--sh)}
.btn.ghost,.modal .btn.ghost,.note .btn.ghost{background:rgba(0,0,0,.28);color:#fff;border-color:rgba(255,255,255,.25);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.big{font-size:1.25rem}
.go{border:3px solid rgba(255,255,255,.55);border-radius:16px;font-weight:400;font-size:1.9rem;text-shadow:0 3px 0 rgba(0,0,0,.3);
  box-shadow:0 6px 0 color-mix(in srgb,var(--pop) 45%,#000),0 0 26px color-mix(in srgb,var(--pop) 45%,transparent);animation:glow 2.4s ease-in-out infinite;transition:transform .08s}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--pop) 45%,#000)}
.go.sm2{font-size:1.5rem}
.claim{border:3px solid rgba(255,255,255,.5);font:400 1.05rem var(--display);letter-spacing:.04em;box-shadow:0 4px 0 color-mix(in srgb,var(--pop) 45%,#000)}

/* panels */
.panel,.sidecard,.card{background:linear-gradient(180deg,var(--panel2),var(--panel));color:#fff;border:3px solid rgba(255,255,255,.13);box-shadow:0 7px 0 rgba(0,0,0,.35)}
.panel,.sidecard{border-radius:22px}
.card{border-radius:18px}
.panel h2{color:#fff;font-size:2.3rem}
.panel .big-ic{filter:drop-shadow(0 8px 0 rgba(0,0,0,.35));animation:bob 3.2s ease-in-out infinite}
.panel:nth-child(2) .big-ic{animation-delay:-1.6s}
.streak{background:rgba(0,0,0,.3);border:2px solid color-mix(in srgb,var(--pop) 65%,transparent);color:#fff;font:400 1.05rem var(--display)}
.sidecard .sh{background:linear-gradient(90deg,var(--pop),color-mix(in srgb,var(--pop) 55%,var(--icon)));color:#fff;font:400 1.3rem var(--display);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.sidecard h3{color:#fff}
.stats span{color:var(--muted)} .stats b{font:400 1.9rem var(--display);color:var(--icon)}
.tip{background:linear-gradient(90deg,var(--icon),color-mix(in srgb,var(--icon) 72%,var(--pop)));color:var(--dark);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.tip b{font:400 1.05rem var(--display);letter-spacing:.04em}
.pill{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.14);font-weight:800}

/* scenario screens look like a device */
.mock{border:4px solid var(--dark);border-radius:18px;box-shadow:0 7px 0 rgba(0,0,0,.4),0 0 0 2px rgba(255,255,255,.12)}
.stage h3{font-size:1.4rem}

/* answer cards */
.opt{display:flex;align-items:center;gap:12px;color:#fff;background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid rgba(255,255,255,.16);
  border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.45);font:700 1rem var(--body);transition:transform .08s,border-color .15s,box-shadow .08s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--icon)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.opt .key{flex:none;display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:10px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2);font:400 1.1rem var(--display);color:var(--icon)}
.opt.ok{border-color:var(--good);background:linear-gradient(180deg,#34a87a,#1f6f51);animation:pop .4s}
.opt.ok .key{background:var(--good);color:#0b3a28;border-color:#fff}
.opt.bad{border-color:var(--bad);background:linear-gradient(180deg,#bd3a50,#7e2235);animation:shake .4s}
.opt.bad .key{background:var(--bad);color:#fff}
.opt:disabled:not(.ok):not(.bad){opacity:.5}

/* meters */
.bar2,.timer{height:16px;border-radius:99px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.15)}
.bar2 i,.timer i{background:linear-gradient(90deg,var(--icon),color-mix(in srgb,var(--icon) 55%,var(--pop)));box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.timer i{transition:width .1s linear}
.timer.low i{background:linear-gradient(90deg,var(--bad),#FF9A5A);animation:blink .45s infinite alternate}
#ttxt,#ottxt{font:400 1.15rem var(--display);color:#fff}
.sbar{height:14px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.1)}
.sbar i{background:linear-gradient(90deg,var(--btn),var(--icon))}
.sb b{font:400 1.15rem var(--display);color:var(--icon)}

/* dialogs */
.overlay{background:rgba(6,5,28,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal{background:linear-gradient(180deg,var(--panel2),var(--panel));color:#fff;border:4px solid var(--edge);border-radius:24px;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const cic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#c-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let RNG=Math.random; /* swapped for a seeded generator so every player in an online match gets the same problems */
const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

/* ---------- daily streak ---------- */
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d);};
const dailyNow=()=>(S.lastDay===today()||S.lastDay===yest())?S.dailyStreak:0;
const dailyReward=n=>Math.min(300,20+10*(n-1));
let pendingDaily=null;
function touchDaily(){
  if(S.lastDay===today())return;
  S.dailyStreak=(S.lastDay===yest())?S.dailyStreak+1:1;
  S.lastDay=today();S.bestDaily=Math.max(S.bestDaily,S.dailyStreak);
  const r=dailyReward(S.dailyStreak);S.coins+=r;pendingDaily={streak:S.dailyStreak,coins:r};
}
function takeDaily(){const d=pendingDaily;pendingDaily=null;return d?`<p>${ic('flame')} <b>Daily streak: day ${d.streak}.</b> Reward: +${d.coins} coins.</p>`:'';}

const defc=(cat,level,id,fn,safe)=>{def(level,id,fn,safe);T[T.length-1].cat=cat;};
V.myth=s=>`<div class="mock"><div class="mh"><b>Myth or fact?</b></div><div class="mb"><div class="mythq">${s}</div></div></div>`;
V.call=(who,sub,lines)=>`<div class="mock"><div class="mb callb"><div class="caller">${who}</div><div class="mutd">${sub}</div>${lines.map(l=>`<div class="bub them">${l}</div>`).join('')}<div class="callbtns"><span class="cb red">End</span><span class="cb green">Speaker</span></div></div></div>`;
V.notif=(items)=>`<div class="mock"><div class="mb lock"><div class="ltime">02:14</div>${items.map(x=>`<div class="ntf"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`;
const MF=(lvl)=>{
  const L1=[
   ['Incognito mode makes you invisible online.',false,'Private mode only stops your own browser from saving history. Websites, your school or your internet provider can still see what you do.'],
   ['Once you delete a post, it is gone forever.',false,'Others can screenshot, share or archive a post in seconds. Think before you post, as if it were permanent.'],
   ['Real companies never ask for your password by email or message.',true,'Correct. Legitimate services never need your password. Anyone asking for it is trying to get into your account.'],
   ['Using the same password everywhere is fine if it is long.',false,'If one site leaks it, attackers try it on all your other accounts. Every account needs its own password; a password manager helps.'],
   ['Software updates often fix security holes.',true,'Correct. Updates patch weaknesses that attackers already know about. Turning on automatic updates is one of the easiest ways to stay safe.'],
   ['A message from a friend\'s account is always really from your friend.',false,'Accounts get hacked. If a message feels unusual, check with your friend another way before clicking anything.'],
  ];
  const L2=[
   ['A padlock (https) in the address bar means the website is safe.',false,'The padlock only means the connection is encrypted. Scam sites can have a padlock too. Always check the actual address.'],
   ['Phones and Macs cannot get malware.',false,'Every device can be attacked. Fake apps, malicious links and unsafe downloads work on phones and Macs too.'],
   ['Two-factor authentication stops most account takeovers, even if your password leaks.',true,'Correct. A second step, like a code or an app prompt, blocks most attackers who only have your password.'],
   ['People on public Wi-Fi can sometimes see what you send.',true,'Correct. On open networks others may watch unencrypted traffic or set up fake hotspots. Avoid logging in to important accounts on them.'],
   ['If an app is in the official app store, it cannot be harmful.',false,'Stores remove many bad apps, but some slip through. Check reviews, the developer and the permissions it asks for.'],
   ['Photos can reveal your location through hidden data.',true,'Correct. Many photos store GPS coordinates in their metadata, and the background can show where you are. Check your camera and sharing settings.'],
   ['AI can copy a person\'s voice from a short recording.',true,'Correct. Voice cloning needs only seconds of audio. That is why a family code word or a call-back is a smart check.'],
  ];
  const pool=lvl===1?L1:L1.concat(L2).slice(L1.length-2);
  const [s,fact,why]=rnd(pool);
  return mk(V.myth(`“${s}”`),'Is this a myth or a fact?',fact?'Fact':'Myth',[fact?'Myth':'Fact'],why,'Think about what could go wrong if you believed it.');
};
defc('facts',1,'myth1',()=>MF(1));
defc('facts',3,'myth2',()=>MF(2));

const CATS=['phishing','scam','privacy','people','security','facts'];
const CATN={phishing:'Phishing',scam:'Scams',privacy:'Privacy',people:'People',security:'Security',facts:'Fact check'};
const CATOF={prize:'scam',prince:'scam',skins:'scam',weakpw:'security','safe-school':'people',gen:'scam',giveaway:'privacy',stranger:'people',overshare:'privacy',virus:'security','safe-login':'phishing',
 phish:'phishing',urlspot:'phishing',sms:'phishing',fakesupport:'phishing',shop:'scam',crack:'security','safe-code':'security','safe-friend':'people',groom:'people',sextort:'people',bully:'people',

const tagRow=sc=>`<div class="tagrow"><span class="tag t-${sc.cat}">${CATN[sc.cat]}</span><span class="stars" aria-label="Difficulty ${sc.level} of 5">${'★'.repeat(sc.level)}<i>${'★'.repeat(5-sc.level)}</i></span></div>`;
function learn(sc,ok){if(!ok||!sc)return;if(!S.cat||typeof S.cat!=='object')S.cat={};S.cat[sc.cat]=(S.cat[sc.cat]||0)+1;}

/* ---------- scenario picker ---------- */
let recent=[];
function pick(level,rec=recent,cat){
  const inCat=t=>!cat||(t.cat||CATOF[t.id]||'scam')===cat;
  let pool=T.filter(t=>inCat(t)&&t.level<=level&&!rec.includes(t.id));
  if(!pool.length)pool=T.filter(t=>inCat(t)&&t.level<=level);
  if(!pool.length)pool=T.filter(t=>inCat(t)&&!rec.includes(t.id));
  if(!pool.length)pool=T.filter(inCat);
  const safes=pool.filter(t=>t.safe);
  if(safes.length&&RNG()<.2)pool=safes;
  const w=pool.map(t=>t.level===level?4:t.level===level-1?2:1);
  let r=RNG()*w.reduce((a,b)=>a+b,0),i=0;
  for(;i<pool.length;i++){r-=w[i];if(r<=0)break;}
  const t=pool[Math.min(i,pool.length-1)];
  rec.push(t.id);if(rec.length>3)rec.shift();
  const sc=t.fn();sc.level=t.level;sc.cat=t.cat||CATOF[t.id]||'scam';sc.view=tagRow(sc)+sc.view;
  sc.opts=shuffle([{t:sc.correct,ok:true},...sc.wrongs.map(x=>({t:x,ok:false}))]);
  return sc;
}
function optsHtml(sc,res,fn){
  return sc.opts.map((o,i)=>{
    let c='opt';if(res){if(o.ok)c+=' ok';else if(res.pick===i)c+=' bad';}
    const cut=!res&&sc.cut&&sc.cut.includes(i);if(cut)c+=' cut';
    return `<button class="${c}" ${res||cut?'disabled':''} onclick="${fn}(${i})"><span class="key" aria-hidden="true">${'ABCD'[i]}</span><span>${o.t}</span></button>`;
  }).join('');
}

let C=null,hintOn=false,spTopic='';
function rPlay(){C=pick(spLevel(),recent,spTopic);hintOn=false;drawPlay(null);}
function drawPlay(res){
  const L=spLevel(),pr=(S.solved+S.combo*2)%10;
  app.innerHTML=`<div class="row between"><h2>${LV[L-1]} level ${L}</h2><div class="row"><span class="pill">${ic('flame')} Combo x${S.combo}</span><span class="pill">Solved: ${S.solved}</span></div></div>
   ${L<5?`<div class="bar2" title="Progress to the next level"><i style="width:${pr*10}%"></i></div>`:''}
   <div class="topics" role="group" aria-label="Practice a topic">${['',...CATS].map(c=>`<button class="tchip ${c===spTopic?'on':''}" onclick="spTopic='${c}';rPlay()" ${c===spTopic?'aria-pressed="true"':''}>${c?`<i class="tdot t-${c}"></i>${CATN[c]}`:'All topics'}</button>`).join('')}</div>
   <div class="stage">${C.view}<h3>${C.prompt}</h3><div class="opts">${optsHtml(C,res,'answerSp')}</div></div>
   <div class="row">${fiftyBtn('sp',C,res)}${hasClue()?`<button class="btn ghost" ${res?'disabled':''} onclick="hintOn=true;drawPlay(null)">${ic('bulb')} Use clue</button>`:`<span class="mut sm">${ic('lock')} Unlock the Clue Giver in the Shop.</span>`}</div>
   ${hintOn&&hasClue()&&!res?`<div class="hintbox">${ic('bulb')} ${C.hint}</div>`:''}`;
}
function answerSp(i){
  const ok=C.opts[i].ok,before=spLevel();learn(C,ok);
  S.attempts++;
  let coins=0;
  if(ok){S.correct++;S.solved++;S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);coins=2+C.level+(S.combo>=5?2:S.combo>=3?1:0);S.coins+=coins;prog('solve');prog('combo',S.combo);}else S.combo=0;
  touchDaily();save();renderTop();drawPlay({pick:i});
  const after=spLevel(),daily=takeDaily(),thisC=C;
  fxAnswer(ok,ok?'+'+coins:'');
  const perfectSp=ok&&S.combo%10===0;
  if(perfectSp){S.coins+=25;save();renderTop();celebrate('PERFECT '+S.combo+'!',S.combo+' right in a row · +25 coins');}
  else if(ok&&(S.combo===3||S.combo===5))setTimeout(()=>{banner('COMBO x'+S.combo,S.combo>=5?'Bonus +2 coins per answer':'Bonus +1 coin per answer');sfx('level');},250);

function mmTick(){
  if(!room)return;
  if(mkOffer&&!MS&&Date.now()-mkAt>20000){mkOffer=null;lobbyPresence();}
  if(MS||!Q)return;
  const qt=$('#qtime');if(qt)qt.textContent=fmtT(Date.now()-Q.since);
  const me=myPeer();if(!me)return;
  const ps=playersIn(room);
  for(const p of ps){
    const mk=p.presence.mk;
    if(p.peer!==me&&mk&&typeof mk==='object'&&mk.m===Q.mode&&typeof mk.c==='string'&&CODE.test(mk.c)&&Array.isArray(mk.p)&&mk.p.includes(me)){
      enterMatch('m-'+mk.c,mk.m,mk.p.filter(x=>typeof x==='string').slice(0,8),false);return;
    }
  }
  const claimed=new Set();
  ps.forEach(p=>{const mk=p.presence.mk;if(mk&&Array.isArray(mk.p))mk.p.forEach(x=>claimed.add(x));});
  const now=Date.now();
  const qd=ps.filter(p=>p.presence.q===Q.mode&&!claimed.has(p.peer)).sort((a,b)=>a.peer<b.peer?-1:1);
  qd.forEach(p=>{if(!seenQ[p.peer])seenQ[p.peer]=now;});
  if(!qd.length||qd[0].peer!==me)return;
  const need=Q.mode==='1v1'?2:4,oldest=Math.min(...qd.map(p=>seenQ[p.peer]));
  if(qd.length>=need||(Q.mode==='ffa'&&qd.length>=2&&now-oldest>15000)){
    const pickd=qd.slice(0,need).map(p=>p.peer),code=newCode(8);
    mkOffer={c:code,m:Q.mode,p:pickd};mkAt=now;
    enterMatch('m-'+code,Q.mode,pickd,false);
  }
}

/* the room creator hosts; if they leave, the player with the lowest peer label takes over */
const hostPeer=()=>{const ps=playersIn(MR),own=ps.filter(p=>p.presence.own===true).map(p=>p.peer).sort();return own[0]||ps.map(p=>p.peer).sort()[0]||null;};
const amPlayer=()=>!!(MS&&MS.g&&MS.g.pl.includes(myPeer()));
function okG(g){
  if(!g||typeof g!=='object'||!['play','done'].includes(g.ph))return null;
  const pl=Array.isArray(g.pl)?g.pl.filter(x=>typeof x==='string').slice(0,8):[];
  if(!pl.length)return null;
  return {v:num(g.v,0,1e9,0),seed:num(g.seed,0,2147483647,1),lvl:num(g.lvl,1,5,1),r:num(g.r,0,4,0),ph:g.ph,pl};
}
function matchUpdate(){
  if(!MS||!MR)return;
  const ps=playersIn(MR);
  ps.forEach(p=>{const pr=p.presence;MS.cache[p.peer]={n:clean(pr.n)||'Player',e:num(pr.e,0,9999,800),em:okItem(pr.em,'emblem'),fr:okItem(pr.fr,'frame'),a:okA(pr.a),here:true};});
  Object.keys(MS.cache).forEach(k=>{if(!ps.some(p=>p.peer===k))MS.cache[k].here=false;});
  seeReactions(ps);
  const hp=ps.find(p=>p.peer===hostPeer()),g=hp&&okG(hp.presence.g);
  if(g&&(!MS.g||g.v>MS.g.v))applyG(g);
  if(cur!=='pvp')return;
  if(!MS.g)drawOnline();else drawBoard();
}
function applyG(g){
  const prev=MS.g;MS.g=g;
  if(!prev||prev.seed!==g.seed){
    MS.set=genSet(g.seed,g.lvl);MS.shown=-1;MS.done=false;MS.result=null;MS.last=null;
    MS.ans=[null,null,null,null,null];MR.presence({a:MS.ans}).catch(()=>{});
  }
  if(g.ph==='play'&&g.r!==MS.shown){

/* ---------- perfect score: celebration song (original tune, synthesised live) ---------- */
let songNodes=[],songEnd=0;
const NOTE=n=>{const m=/^([A-G])(#?)(\d)$/.exec(n);const i={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(i+12*(+m[3]+1)-69)/12);};

function playSong(){
  if(S.mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return;}
  stopSong();
  const bt=.36,t0=AC.currentTime+.08,master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  const tone=(f,start,dur,type,vol,dest=master)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+dur);
    o.connect(g);g.connect(dest);o.start(start);o.stop(start+dur+.05);songNodes.push(o);};
  const lead=[['G4',.5],['C5',.5],['E5',.5],['G5',.5],['C6',1],['G5',.5],['C6',.5],
              ['A5',.5],['G5',.5],['F5',.5],['A5',.5],['C6',1.5],['A5',.5],
              ['B5',.5],['A5',.5],['G5',.5],['B5',.5],['D6',1],['B5',.5],['G5',.5],
              ['C6',.5],['G5',.5],['E5',.5],['G5',.5],['C6',2]];
  let t=t0;lead.forEach(([n,b])=>{tone(NOTE(n),t,b*bt*.95,'square',.16);tone(NOTE(n)*2,t,b*bt*.6,'triangle',.05);t+=b*bt;});
  const roots=['C3','F3','G3','C3'],chords=[['C4','E4','G4'],['F4','A4','C5'],['G4','B4','D5'],['C4','E4','G4']];
  roots.forEach((r,bar)=>{for(let k=0;k<8;k++){const s=t0+(bar*4+k*.5)*bt;tone(NOTE(r)/(k%2?1:2),s,bt*.45,'triangle',.22);}
    chords[bar].forEach((c,j)=>{for(let k=0;k<4;k++)tone(NOTE(c),t0+(bar*4+k+j*.12)*bt,bt*.5,'sine',.05);});});
  // drums: kick on beats, noise hat on off-beats
  const nb=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  for(let k=0;k<16;k++){const s=t0+k*bt;
    const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,s);o.frequency.exponentialRampToValueAtTime(45,s+.12);
    g.gain.setValueAtTime(.5,s);g.gain.exponentialRampToValueAtTime(.001,s+.15);o.connect(g);g.connect(master);o.start(s);o.stop(s+.2);songNodes.push(o);
    const h=AC.createBufferSource(),hg=AC.createGain(),hf=AC.createBiquadFilter();h.buffer=nb;hf.type='highpass';hf.frequency.value=6000;hg.gain.value=.25;
    h.connect(hf);hf.connect(hg);hg.connect(master);h.start(s+bt/2);songNodes.push(h);}
  // final chord
  const end=t0+16*bt;['C4','E4','G4','C5','E5','G5','C6'].forEach((n,i)=>tone(NOTE(n),end+i*.04,1.8,i<3?'triangle':'square',i<3?.12:.06));
  tone(NOTE('C2'),end,1.6,'triangle',.3);
  songEnd=Date.now()+(end-AC.currentTime+1.9)*1000;
}

  return `<div class="duel-top"><span class="pill">${label}</span><div class="vsbar" aria-label="Score"><span class="s-me">${me.pts}</span><span class="vs">VS</span><span class="s-opp">${opp.pts}</span></div>
   <div class="pips" aria-label="Round ${Math.min(round+1,5)} of 5">${[0,1,2,3,4].map(k=>`<i class="${k<round?'done':k===round?'now':''}"></i>`).join('')}</div></div>`;
}
function duelHtml(label,f,round,mid){
  return duelTop(label,f.opp,f.me,round)+`<div class="duel" id="duel">${fighterHtml('me',f.me)}<section class="duel-mid">${mid}</section>${fighterHtml('opp',f.opp)}</div>`;
}
function refreshDuel(){
  if(!$('#duel'))return;
  const f=MS&&MS.g?onlineFighters():M?botFighters():null;if(!f)return;
  const o=$('.fighter.opp'),m=$('.fighter.me'),v=$('.duel-top .vsbar');
  if(o)o.outerHTML=fighterHtml('opp',f.opp);if(m)m.outerHTML=fighterHtml('me',f.me);
  if(v)v.outerHTML=`<div class="vsbar" aria-label="Score"><span class="s-me">${f.me.pts}</span><span class="vs">VS</span><span class="s-opp">${f.opp.pts}</span></div>`;
}
function botFighters(){
  const b=M.bots[0],r=Math.min(M.round,4),started=!!M.sc&&M.t0,el=started?(Date.now()-M.t0)/1000:0,x=b.rounds[r];
  const oa=b.rounds.map((q,k)=>k<M.round||(k===M.round&&M.last)?(q.ok?1:0):null);
  const opp={peer:'bot0',name:b.name,elo:b.elo||800,em:b.em,fr:b.fr,pts:b.pts,streak:streakOf(oa,M.last?M.round:M.round-1),
    status:!started?'Ready':M.last?(x.ok?'✓ Correct':'✗ Wrong'):el>=x.t?'✓ Answered':'Thinking…',cls:M.last?(x.ok?'ok':'bad'):el>=x.t?'ok':''};
  const L=M.last;
  const me={peer:'me',name:S.name,elo:S.elo,em:S.equip.emblem,fr:S.equip.frame,pts:M.me.pts,streak:M.me.streak||0,
    status:!started?'Ready':L?(L.pick<0?'⏱ Time is up':L.ok?`✓ Correct · ${L.t.toFixed(1)}s`:'✗ Wrong'):'Your turn',cls:L?(L.ok?'ok':'bad'):'turn'};
  return {opp,me};
}
const isDuel=()=>!!(MS&&MS.g&&MS.g.pl.length===2&&amPlayer());
function onlineFighters(){
  const meP=myPeer(),g=MS.g,op=g.pl.find(p=>p!==meP),c=MS.cache[op]||{n:'Player',e:800,a:[null,null,null,null,null]};
  const r=g.r,done=g.ph==='done',mine=MS.ans[r]!=null||done,cd=!!MS.cdUntil;
  const oa=(c.a||[]).map((v,k)=>k<r||(k===r&&mine)||done?v:null);
  const opp={peer:op,name:c.n,elo:c.e,em:c.em,fr:c.fr,pts:sumA(oa),streak:streakOf(oa,done?4:mine?r:r-1),
    status:!c.here?'Left the match':cd?'Ready':done?'Finished':(c.a||[])[r]!=null?(mine?((c.a[r]>0)?`✓ Correct · +${c.a[r]}`:'✗ Wrong'):'✓ Answered'):'Thinking…',
    cls:!c.here?'bad':cd||done?'':(c.a||[])[r]!=null?(mine?(c.a[r]>0?'ok':'bad'):'ok'):''};
  const L=MS.last,my=MS.ans[r];
  const me={peer:meP,name:S.name,elo:S.elo,em:S.equip.emblem,fr:S.equip.frame,pts:sumA(MS.ans),streak:streakOf(MS.ans,my!=null?r:r-1),
    status:cd?'Ready':done?'Finished':my!=null?(L?(L.pick<0?'⏱ Time is up':L.ok?`✓ Correct · ${L.t.toFixed(1)}s`:'✗ Wrong'):(my>0?'✓ Correct':'✗ Wrong')):'Your turn',
    cls:cd||done?'':my!=null?(my>0?'ok':'bad'):'turn'};
  return {opp,me};
}

/* ---------- match result: one winner; coins only for the winner, a small loss for the others ---------- */
const WIN_BASE=30,WIN_PER_WRONG=5,WIN_MIN=10,LOSE_BASE=5,LOSE_PER_WRONG=3,LOSE_MAX=20;
function settle(players,wrong){
  const rank=[...players].sort((a,b)=>b.pts-a.pts||b.right-a.right),top=rank[0];
  const tied=rank.filter(p=>p.pts===top.pts&&p.right===top.right),me=players.find(p=>p.me);
  const outcome=!me?'none':tied.length>1?(tied.includes(me)?'draw':'lose'):(top===me?'win':'lose');
  const ref=outcome==='win'?rank[1]:top,margin=me&&ref?Math.abs(me.pts-ref.pts):0;
  const delta=outcome==='win'||outcome==='lose'?12+Math.round(Math.min(1,margin/500)*13):0;
  let coins=0;
  if(outcome==='win'){coins=Math.max(WIN_MIN,WIN_BASE-WIN_PER_WRONG*wrong);S.coins+=coins;}
  else if(outcome==='lose'){coins=-Math.min(S.coins,Math.min(LOSE_MAX,LOSE_BASE+LOSE_PER_WRONG*wrong));S.coins+=coins;}
  if(me){
    S.elo=Math.max(100,S.elo+(outcome==='win'?delta:outcome==='lose'?-delta:0));
    S.pvpPlayed++;prog('pvp');if(outcome==='win'){S.pvpWins=(S.pvpWins||0)+1;prog('win');}
    if(outcome!=='draw')S.pvpStreak=outcome==='win'?S.pvpStreak+1:0;S.bestPvpStreak=Math.max(S.bestPvpStreak,S.pvpStreak);
  }
  return {outcome,rank,top,tied,delta,coins,wrong};
}
const outcomeTitle=o=>o==='win'?'Victory!':o==='lose'?'Defeat':o==='draw'?'Draw!':'Match over';
function resultHtml(R){
  const winner=R.tied.length>1?`Draw between ${R.tied.map(p=>'<b>'+esc(p.n)+'</b>').join(' and ')}`:`Winner: <b>${esc(R.top.n)}</b>${R.top.me?' (you)':''}`;
  const coinLine=R.outcome==='win'?`+${R.coins} coins <span class="sm">(${WIN_BASE} minus ${WIN_PER_WRONG} for each wrong answer · you had ${R.wrong})</span>`
    :R.outcome==='lose'?`${R.coins} coins <span class="sm">(${LOSE_BASE} plus ${LOSE_PER_WRONG} for each wrong answer · you had ${R.wrong})</span>`:'No coins won or lost';
  return `<div class="winner">${cic('trophy')}<span>${winner}</span></div>
   <ul class="ranklist">${R.rank.map((p,i)=>`<li class="${R.tied.length===1&&i===0?'w':''}${p.me?' me':''}"><span>${R.tied.length===1&&i===0?'👑':(i+1)+'.'}</span><span>${esc(p.n)}${p.me?' (you)':''}${p.left?' (left)':''}</span><span>${p.pts} pts · ${p.right}/5</span></li>`).join('')}</ul>
   ${R.outcome==='none'?'':`<p>${ic('bolt')} Elo: <b>${R.delta?(R.outcome==='win'?'+':'-')+R.delta:'±0'}</b> (now ${S.elo})</p><p class="coinline ${R.outcome}">${ic('coin')} ${coinLine}</p>`}`;
}
function outcomeFx(R,perfect){
  if(perfect){celebrate('PERFECT MATCH!',R.outcome==='win'?'5 out of 5 · +25 coins':'5 out of 5');return;}
  banner(R.outcome==='win'?'YOU WIN!':R.outcome==='lose'?'YOU LOSE':R.outcome==='draw'?'DRAW':'MATCH OVER',R.outcome==='win'?'+'+R.coins+' coins':R.outcome==='lose'?R.coins+' coins':'',1800);
  sfx(R.outcome==='win'?'win':'lose');if(R.outcome==='win')confetti(130);
}

if(S.name==='Guardian'){S.name='Guardian'+(100+Math.floor(Math.random()*900));saveLocal();}
applyTheme();
const h0=(location.hash||'').slice(1);
show(['home','play','blitz','pvp','shop','ranks'].includes(h0)?h0:'home');
initNet();
